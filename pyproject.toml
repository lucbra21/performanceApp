[project]
name = "performance-app"
version = "0.1.0"
description = "Performance Analysis Dashboard"
requires-python = ">=3.9"
dependencies = [
    "dash>=2.14.1",
    "dash-bootstrap-components>=1.5.0",
    "dash-core-components>=2.0.0",
    "dash-html-components>=2.0.0",
    "dash-table>=5.0.0",
    "fastexcel>=0.15.1",
    "gunicorn",
    "ipykernel>=6.30.1",
    "numpy>=1.26.0",
    "pandas>=2.1.1",
    "plotly>=5.18.0",
    "polars>=1.30.0",
    "pyarrow>=20.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["components", "pages", "utils", "assets", "data"]
include = ["app.py"]
